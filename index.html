<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nöbet Takip</title>
  <meta name="description" content="24 saatlik nöbetlerin hafta sonu, tatil ve aralık dağılımını takip eden adalet analizi.">
  <meta name="theme-color" content="#070b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { const t = JSON.parse(localStorage.getItem('nobetTakip.v1') || '{}').settings?.theme; if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img class="logo" src="icons/app-icon-192.png" alt="" aria-hidden="true">
      <div>
        <h1 id="title">Panel</h1>
        <div class="sub" id="subtitle">Nöbet Takip</div>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" aria-label="Tema değiştir"></button>
    </header>
    <main id="view"></main>
  </div>

  <nav class="nav" id="nav">
    <button data-tab="panel"><span data-icon="gauge"></span>Panel</button>
    <button data-tab="takvim"><span data-icon="calendar"></span>Takvim</button>
    <button data-tab="analiz"><span data-icon="chart"></span>Analiz</button>
    <button data-tab="ayarlar"><span data-icon="settings"></span>Ayarlar</button>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="vendor/echarts.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
